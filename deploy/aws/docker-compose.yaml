services:
  redis:
    image: redis:7-alpine
    container_name: prepmap-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: prepmap-api:ec2
    container_name: prepmap-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.ec2
    environment:
      NODE_ENV: production
      PORT: 4000
      REDIS_URL: redis://redis:6379
    expose:
      - "4000"

  frontend:
    build:
      context: ../..
      dockerfile: deploy/aws/frontend.Dockerfile
    image: prepmap-frontend:ec2
    container_name: prepmap-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env.ec2
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
